[workspace]
members = [".", "crates/wf-traffic", "crates/wf-wifi", "crates/wf-tools", "crates/wf-firewall"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Zheer Khalid (https://zheer.dev)"]
homepage = "https://zheer.dev"
repository = "https://github.com/zheerkhalid/wireforge"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "wireforge"
version.workspace = true
edition.workspace = true
description = "A network and Wi-Fi monitor and toolkit for Windows: live traffic, per-app usage, Wi-Fi analysis, saved networks, devices and diagnostics"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "wireforge"
path = "src/lib.rs"

[[bin]]
name = "WireForge"
path = "src/main.rs"
test = false

[dependencies]
wf-traffic = { path = "crates/wf-traffic" }
wf-wifi = { path = "crates/wf-wifi" }
wf-tools = { path = "crates/wf-tools" }
wf-firewall = { path = "crates/wf-firewall" }
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
# Native open/save dialogs (uses the system dialogs, no extra runtime).
rfd = { version = "0.15", default-features = false }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
tiny-skia = "0.11"
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
